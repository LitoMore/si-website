<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			content="width=device-width, initial-scale=1, viewport-fit=cover"
			name="viewport"
		/>
		<title>{{pageTitle}}</title>
		<style>
			#cover {
				display: none;
				position: fixed;
				place-items: center;
				inset: 0;
				background: Canvas;
				pointer-events: none;
				color: CanvasText;
				color-scheme: light dark;
			}

			#root:empty + #cover,
			#cover:has(progress) {
				display: grid;
			}

			#cover:has(progress) {
				background: transparent;
				color: var(--ui-fg);
			}

			#cover svg {
				fill: currentColor;
				width: 100px;
				height: 100px;
			}

			@media (prefers-reduced-motion: no-preference) {
				#cover svg {
					animation: logo-breathe 3s ease-in-out infinite;
				}
			}

			@keyframes logo-breathe {
				50% {
					transform: scale(1.1);
				}
			}

			#catalog-loading-status {
				position: absolute;
				top: calc(50% + 70px);
			}
		</style>
		<meta content="{{pageDescription}}" name="description" />
		<link href="https://simpleicons.org{{pagePath}}" rel="canonical" />
		<meta content="{{pageTitle}}" property="og:title" />
		<meta content="{{pageDescription}}" property="og:description" />
		<meta content="https://simpleicons.org{{pagePath}}" property="og:url" />
		<meta content="{{pageTitle}}" name="twitter:title" />
		<meta content="{{pageDescription}}" name="twitter:description" />
		<meta content="https://simpleicons.org{{pagePath}}" name="twitter:url" />
		<meta content="14319924BC1F00DC15EF0EAA29E72404" name="msvalidate.01" />
		<meta content="8b467a0b98aa2725" name="yandex-verification" />
		<meta content="website" property="og:type" />
		<meta content="Simple Icons" property="og:site_name" />
		<meta content="https://simpleicons.org/og.png" property="og:image" />
		<meta content="summary_large_image" name="twitter:card" />
		<meta content="https://simpleicons.org/og.png" name="twitter:image" />
		<link
			type="application/opensearchdescription+xml"
			href="/opensearch.xml"
			rel="search"
			title="Simple Icons"
		/>
		<link href="/license.txt" rel="license" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "Simple Icons",
				"url": "https://simpleicons.org/",
				"logo": "https://simpleicons.org/simpleicons-icon.svg",
				"image": "https://simpleicons.org/simpleicons-icon.svg",
				"potentialAction": {
					"@type": "SearchAction",
					"target": "https://simpleicons.org/?q={search_term_string}",
					"query-input": "required name=search_term_string"
				}
			}
		</script>
		<link type="image/svg+xml" href="/simpleicons-icon.svg" rel="icon" />
		<link href="/simpleicons-icon.png" rel="shortcut icon" />
		<link href="/simpleicons-icon.png" rel="apple-touch-icon" />
		<link href="/simpleicons-icon.png" rel="apple-touch-startup-image" />
		<meta content="yes" name="mobile-web-app-capable" />
		<meta content="yes" name="apple-mobile-web-app-capable" />
		<meta content="Simple Icons" name="apple-mobile-web-app-title" />
		<meta content="default" name="apple-mobile-web-app-status-bar-style" />
		<meta content="telephone=no" name="format-detection" />
		<meta content="no" name="msapplication-tap-highlight" />
	</head>
	<body>
		<div id="root"></div>
		<div id="cover">
			<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<title>Simple Icons</title>
				<path
					d="M12 0C8.688 0 6 2.688 6 6s2.688 6 6 6c4.64-.001 7.526 5.039 5.176 9.04h1.68A7.507 7.507 0 0 0 12 10.5 4.502 4.502 0 0 1 7.5 6c0-2.484 2.016-4.5 4.5-4.5s4.5 2.016 4.5 4.5H18c0-3.312-2.688-6-6-6Zm0 3a3 3 0 0 0 0 6c4 0 4-6 0-6Zm0 1.5A1.5 1.5 0 0 1 13.5 6v.002c-.002 1.336-1.617 2.003-2.561 1.058C9.995 6.115 10.664 4.5 12 4.5ZM7.5 15v1.5H9v6H4.5V24h15v-1.5H15v-6h1.5V15Zm3 1.5h3v6h-3zm-6 1.47c0 1.09.216 2.109.644 3.069h1.684A5.957 5.957 0 0 1 6 17.97Z"
				/>
			</svg>
			<div id="catalog-loading-status"></div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
