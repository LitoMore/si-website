<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			content="width=device-width, initial-scale=1, viewport-fit=cover"
			name="viewport"
		/>
		<title>Simple Icons</title>
		<style>
			@keyframes animate {
				0% {
					transform: scale(1);
				}
				50% {
					transform: scale(1.1);
				}
				100% {
					transform: scale(1);
				}
			}

			.logo {
				animation: animate 3s ease-in-out infinite;
				width: 100px;
				height: 100px;
			}

			#cover {
				display: flex;
				position: fixed;
				top: 0;
				left: 0;
				justify-content: center;
				align-items: center;
				opacity: 1;
				z-index: 10000;
				transition: opacity 0.5s;
				background-color: #333;
				width: 100vw;
				height: 100vh;
				color: #eee;
				font-family: monospace;
			}

			#cover svg path {
				fill: #eee;
			}

			/*
			@media (prefers-color-scheme: dark) {
				#cover {
					background-color: #111;
				}
				#cover svg path {
					fill: #eee;
				}
			}
			*/
		</style>
		<meta
			content="Browse, customize, and download free SVG icons for popular brands."
			name="description"
		/>
		<meta content="Simple Icons" property="og:title" />
		<meta content="website" property="og:type" />
		<meta content="https://icons.litomore.me/" property="og:url" />
		<meta content="https://icons.litomore.me/og.png" property="og:image" />
		<link type="image/svg+xml" href="/simpleicons-icon.svg" rel="icon" />
		<link href="/simpleicons-icon.png" rel="shortcut icon" />
		<link href="/simpleicons-icon.png" rel="apple-touch-icon" />
		<link href="/simpleicons-icon.png" rel="apple-touch-startup-image" />
		<meta content="yes" name="mobile-web-app-capable" />
		<meta content="yes" name="apple-mobile-web-app-capable" />
		<meta content="Simple Icons" name="apple-mobile-web-app-title" />
		<meta content="default" name="apple-mobile-web-app-status-bar-style" />
		<meta content="telephone=no" name="format-detection" />
		<meta content="no" name="msapplication-tap-highlight" />
	</head>
